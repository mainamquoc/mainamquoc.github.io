<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Pie Chart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b1021;
        --panel: #131b2f;
        --muted: #8ca0c4;
        --text: #e6edff;
        --accent: #6ae3ff;
        --january: #6ae3ff;
        --february: #f38ba3;
        --march: #8ce99a;
        --april: #ffd166;
        --may: #b197fc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at 20% 20%, rgba(106, 227, 255, 0.15), transparent 35%),
          radial-gradient(circle at 80% 0%, rgba(177, 151, 252, 0.18), transparent 30%),
          var(--bg);
        color: var(--text);
        padding: 24px;
      }

      .card {
        width: min(960px, 100%);
        display: grid;
        gap: 24px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(8px);
      }

      .card header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
      }

      .eyebrow {
        color: var(--muted);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: 12px;
        font-weight: 700;
      }

      h1 {
        margin: 4px 0 6px;
        font-size: clamp(22px, 2vw + 12px, 30px);
      }

      .subheading {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 10px 12px;
        border-radius: 12px;
      }

      .controls label {
        font-size: 14px;
        color: var(--muted);
      }

      select {
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: var(--panel);
        color: var(--text);
        font-size: 14px;
      }

      .chart-area {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        align-items: center;
        gap: 24px;
      }

      .legend {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
        padding: 12px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.02);
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text);
        font-weight: 600;
      }

      .legend-swatch {
        width: 14px;
        height: 14px;
        border-radius: 6px;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1);
      }

      @media (max-width: 640px) {
        .card header {
          align-items: flex-start;
        }

        select {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/recharts/umd/Recharts.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const { PieChart, Pie, Label, Sector, Tooltip } = Recharts

      const desktopData = [
        { month: "january", desktop: 186, fill: "var(--january)" },
        { month: "february", desktop: 305, fill: "var(--february)" },
        { month: "march", desktop: 237, fill: "var(--march)" },
        { month: "april", desktop: 173, fill: "var(--april)" },
        { month: "may", desktop: 209, fill: "var(--may)" },
      ]

      const monthLabels = {
        january: "January",
        february: "February",
        march: "March",
        april: "April",
        may: "May",
      }

      function ActiveShape(props) {
        const { outerRadius = 0 } = props
        return (
          <g>
            <Sector {...props} outerRadius={outerRadius + 10} />
            <Sector {...props} outerRadius={outerRadius + 26} innerRadius={outerRadius + 14} />
          </g>
        )
      }

      function ChartPieInteractive() {
        const [activeMonth, setActiveMonth] = React.useState(desktopData[0].month)

        const activeIndex = React.useMemo(
          () => desktopData.findIndex((item) => item.month === activeMonth),
          [activeMonth]
        )

        return (
          <div className="card">
            <header>
              <div>
                <div className="eyebrow">Traffic overview</div>
                <h1>Pie Chart — Interactive</h1>
                <p className="subheading">January – May 2024</p>
              </div>
              <div className="controls">
                <label htmlFor="month">Active slice</label>
                <select id="month" value={activeMonth} onChange={(event) => setActiveMonth(event.target.value)}>
                  {desktopData.map((item) => (
                    <option key={item.month} value={item.month}>
                      {monthLabels[item.month]}
                    </option>
                  ))}
                </select>
              </div>
            </header>

            <div className="chart-area">
              <PieChart width={360} height={360} className="chart">
                <Tooltip
                  contentStyle={{
                    background: "rgba(11, 16, 33, 0.9)",
                    border: "1px solid rgba(255, 255, 255, 0.12)",
                    borderRadius: 10,
                    color: "var(--text)",
                  }}
                  labelFormatter={(label) => monthLabels[label] || label}
                  formatter={(value) => [value.toLocaleString(), "Visitors"]}
                />
                <Pie
                  data={desktopData}
                  dataKey="desktop"
                  nameKey="month"
                  cx="50%"
                  cy="50%"
                  innerRadius={80}
                  strokeWidth={5}
                  activeIndex={activeIndex}
                  activeShape={ActiveShape}
                >
                  <Label
                    content={({ viewBox }) => {
                      if (viewBox && "cx" in viewBox && "cy" in viewBox) {
                        return (
                          <text x={viewBox.cx} y={viewBox.cy} textAnchor="middle" dominantBaseline="middle">
                            <tspan x={viewBox.cx} y={viewBox.cy} className="fill-foreground" style={{ fontSize: "32px", fontWeight: 700 }}>
                              {desktopData[activeIndex].desktop.toLocaleString()}
                            </tspan>
                            <tspan
                              x={viewBox.cx}
                              y={(viewBox.cy || 0) + 22}
                              className="fill-muted-foreground"
                              style={{ fill: "var(--muted)", fontSize: "14px" }}
                            >
                              Visitors
                            </tspan>
                          </text>
                        )
                      }
                      return null
                    }}
                  />
                </Pie>
              </PieChart>

              <div className="legend" aria-label="Monthly visitors">
                {desktopData.map((item, index) => (
                  <div key={item.month} className="legend-item">
                    <span
                      className="legend-swatch"
                      style={{ backgroundColor: item.fill, opacity: activeIndex === index ? 1 : 0.5 }}
                    />
                    <span>
                      {monthLabels[item.month]}
                      {" • "}
                      {item.desktop.toLocaleString()} visitors
                    </span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )
      }

      const root = ReactDOM.createRoot(document.getElementById("root"))
      root.render(<ChartPieInteractive />)
    </script>
  </body>
</html>
